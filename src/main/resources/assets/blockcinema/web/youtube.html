<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube identifies embedding apps by the Referer; keep the default origin-only referrer. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Plays one video or playlist with the official YouTube IFrame Player API, filling the page.
  // Nothing is drawn over the player.
  var params = new URLSearchParams(location.search);
  var video = /^[A-Za-z0-9_-]{11}$/.test(params.get('v') || '') ? params.get('v') : null;
  var list = /^[A-Za-z0-9_-]{2,64}$/.test(params.get('list') || '') ? params.get('list') : null;
  // Where to start in the playlist, from 0.
  var index = /^\d{1,4}$/.test(params.get('index') || '') ? Number(params.get('index')) : 0;
  // Where to start, in seconds (resuming), passed in the fragment.
  var start = Math.floor(Number(new URLSearchParams(location.hash.slice(1)).get('start')) || 0);
  var player;
  var ready = false;
  // Silent until the mod says how loud (it knows how far away the player is).
  var volume = 0;
  var visible = true;
  var pausedOutOfSight = false;

  // Called by the mod a few times a second: volume 0 to 1 from the player's distance, and whether the TV
  // is in sight. YouTube's terms don't allow playing in a player the user can't see, so it pauses then,
  // and resumes only a pause it made itself.
  window.blockcinemaState = function (newVolume, newVisible) {
    volume = newVolume;
    visible = newVisible;
    if (ready) {
      apply();
    }
  };

  // Where the video is, once a second, for the mod's time bar and resume (read from the browser console):
  // "[blockcinema-state] <seconds> <length in seconds, 0 if live or unknown> <1 if paused>".
  function report(time, length, paused) {
    console.log('[blockcinema-state] ' + (time || 0).toFixed(1) + ' ' + (isFinite(length) && length > 0 ? length.toFixed(1) : '0')
        + ' ' + (paused ? 1 : 0));
  }

  // What went wrong, for the mod's messages ("none" when playing again):
  // "[blockcinema-error] <code>".
  function reportError(code) {
    console.log('[blockcinema-error] ' + code);
  }

  // The video ended, so the screen's queue can go on: "[blockcinema-ended]".
  function reportEnded() {
    console.log('[blockcinema-ended]');
  }

  // Called by the mod to jump to a time, in seconds.
  window.blockcinemaSeek = function (seconds) {
    if (ready) {
      player.seekTo(Math.max(0, seconds), true);
    }
  };

  // Called by the mod to follow the TV's shared play/pause state. Out of sight, a resume waits until seen.
  var wantPaused = false;
  window.blockcinemaSetPaused = function (paused) {
    wantPaused = paused;
    if (!ready) {
      return;
    }
    if (paused) {
      pausedOutOfSight = false;
      player.pauseVideo();
    } else if (visible) {
      player.playVideo();
    } else {
      pausedOutOfSight = true;
    }
  };

  // Captions, from the player's setting: off unless turned on, even when YouTube would show them by itself
  // (it does for a video in another language than the browser's). Applied again whenever a video starts.
  var captions = false;
  var captionLanguage = '';
  window.blockcinemaCaptions = function (on, language) {
    captions = on;
    captionLanguage = language;
    if (ready) {
      applyCaptions();
    }
  };

  function applyCaptions() {
    try {
      if (captions) {
        player.loadModule('captions');
        if (captionLanguage) {
          player.setOption('captions', 'track', { languageCode: captionLanguage });
        }
      } else {
        player.unloadModule('captions');
        player.unloadModule('cc');
      }
    } catch (e) {
      // The player has no captions module (yet): nothing to turn off.
    }
  }

  function apply() {
    player.setVolume(Math.round(volume * 100));
    var state = player.getPlayerState();
    if (!visible && (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING)) {
      player.pauseVideo();
      pausedOutOfSight = true;
    } else if (visible && pausedOutOfSight && !wantPaused) {
      pausedOutOfSight = false;
      player.playVideo();
    }
  }

  function onYouTubeIframeAPIReady() {
    var vars = { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin };
    if (start > 0) {
      vars.start = start;
    }
    if (list) {
      vars.listType = 'playlist';
      vars.list = list;
      vars.index = index;
    }
    player = new YT.Player('player', {
      // Privacy-enhanced mode: the player stores less about the viewer.
      host: 'https://www.youtube-nocookie.com',
      width: '100%',
      height: '100%',
      videoId: video || undefined,
      playerVars: vars,
      events: {
        onError: function (event) {
          var codes = { 2: 'bad_video', 5: 'playback', 100: 'not_found', 101: 'no_embed', 150: 'no_embed' };
          reportError(codes[event.data] || 'playback');
        },
        onStateChange: function (event) {
          if (event.data === YT.PlayerState.PLAYING) {
            reportError('none');
            applyCaptions();
          } else if (event.data === YT.PlayerState.ENDED) {
            // In a playlist, say which video comes next, so everyone moves on to it together.
            var at = list ? player.getPlaylistIndex() : -1;
            var count = list ? (player.getPlaylist() || []).length : 0;
            if (at >= 0 && at + 1 < count) {
              console.log('[blockcinema-ended] ' + (at + 1));
            } else {
              reportEnded();
            }
          }
        },
        onReady: function (event) {
          ready = true;
          applyCaptions();
          setInterval(function () {
            var state = player.getPlayerState();
            if (list) {
              // Where the playlist is, for the next and previous buttons: "[blockcinema-list] <index>".
              console.log('[blockcinema-list] ' + player.getPlaylistIndex());
            }
            report(player.getCurrentTime(), player.getDuration(),
                state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING);
          }, 1000);
          event.target.setVolume(Math.round(volume * 100));
          if (visible && !wantPaused) {
            event.target.playVideo();
          } else {
            pausedOutOfSight = true;
          }
        }
      }
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
