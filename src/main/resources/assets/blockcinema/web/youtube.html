<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube identifies embedding apps by the Referer; keep the default origin-only referrer. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Plays one video or playlist with the official YouTube IFrame Player API, filling the page.
  // Nothing is drawn over the player.
  var params = new URLSearchParams(location.search);
  var video = /^[A-Za-z0-9_-]{11}$/.test(params.get('v') || '') ? params.get('v') : null;
  var list = /^[A-Za-z0-9_-]{2,64}$/.test(params.get('list') || '') ? params.get('list') : null;
  // Where to start, in seconds (resuming), passed in the fragment.
  var start = Math.floor(Number(new URLSearchParams(location.hash.slice(1)).get('start')) || 0);
  var player;
  var ready = false;
  var volume = 1;
  var visible = true;
  var pausedOutOfSight = false;

  // Called by the mod a few times a second: volume 0 to 1 from the player's distance, and whether the TV
  // is in sight. YouTube's terms don't allow playing in a player the user can't see, so it pauses then,
  // and resumes only a pause it made itself.
  window.blockcinemaState = function (newVolume, newVisible) {
    volume = newVolume;
    visible = newVisible;
    if (ready) {
      apply();
    }
  };

  // Where the video is, once a second, for the mod's time bar and resume (read from the browser console):
  // "[blockcinema-state] <seconds> <length in seconds, 0 if live or unknown> <1 if paused>".
  function report(time, length, paused) {
    console.log('[blockcinema-state] ' + (time || 0).toFixed(1) + ' ' + (isFinite(length) && length > 0 ? length.toFixed(1) : '0')
        + ' ' + (paused ? 1 : 0));
  }

  // Called by the mod to jump to a time, in seconds.
  window.blockcinemaSeek = function (seconds) {
    if (ready) {
      player.seekTo(Math.max(0, seconds), true);
    }
  };

  // Called by the mod when the player presses Play/Pause in the TV menu.
  window.blockcinemaToggle = function () {
    if (!ready) {
      return;
    }
    var state = player.getPlayerState();
    pausedOutOfSight = false;
    if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  };

  function apply() {
    player.setVolume(Math.round(volume * 100));
    var state = player.getPlayerState();
    if (!visible && (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING)) {
      player.pauseVideo();
      pausedOutOfSight = true;
    } else if (visible && pausedOutOfSight) {
      pausedOutOfSight = false;
      player.playVideo();
    }
  }

  function onYouTubeIframeAPIReady() {
    var vars = { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin };
    if (start > 0) {
      vars.start = start;
    }
    if (list) {
      vars.listType = 'playlist';
      vars.list = list;
    }
    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      videoId: video || undefined,
      playerVars: vars,
      events: {
        onReady: function (event) {
          ready = true;
          setInterval(function () {
            var state = player.getPlayerState();
            report(player.getCurrentTime(), player.getDuration(),
                state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING);
          }, 1000);
          event.target.setVolume(Math.round(volume * 100));
          if (visible) {
            event.target.playVideo();
          } else {
            pausedOutOfSight = true;
          }
        }
      }
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
