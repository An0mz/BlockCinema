<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ddd; font: 32px sans-serif; text-align: center; padding: 40px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="message"></div>
<script src="hls.min.js"></script>
<script>
  // Plays one video: Jellyfin streams and direct links (HLS .m3u8 with hls.js, anything else with the
  // browser's own player). This page shows the player's own media, so it keeps playing out of sight.
  var video = document.getElementById('video');
  var src = new URLSearchParams(location.search).get('src') || '';
  // A Jellyfin login header, passed in the fragment so it is never sent anywhere but to that server.
  var fragment = new URLSearchParams(location.hash.slice(1));
  var auth = fragment.get('auth');
  // Where to start, in seconds (resuming).
  var start = Number(fragment.get('start')) || 0;
  var volume = 1;

  function show(text) {
    var message = document.getElementById('message');
    message.textContent = text;
    message.style.display = 'flex';
    console.log('[blockcinema] video: ' + text);
  }

  // Called by the mod a few times a second: volume 0 to 1 from the player's distance.
  window.blockcinemaState = function (newVolume, visible) {
    volume = newVolume;
    video.volume = Math.max(0, Math.min(1, volume));
  };

  // Where the video is, once a second, for the mod's time bar and resume (read from the browser console):
  // "[blockcinema-state] <seconds> <length in seconds, 0 if live or unknown> <1 if paused>".
  function report(time, length, paused) {
    console.log('[blockcinema-state] ' + (time || 0).toFixed(1) + ' ' + (isFinite(length) && length > 0 ? length.toFixed(1) : '0')
        + ' ' + (paused ? 1 : 0));
  }

  // Called by the mod to jump to a time, in seconds.
  window.blockcinemaSeek = function (seconds) {
    video.currentTime = Math.max(0, seconds);
  };

  // Called by the mod to follow the TV's shared play/pause state.
  window.blockcinemaSetPaused = function (paused) {
    if (paused) {
      video.pause();
    } else {
      video.play().catch(function () {});
    }
  };

  console.log('[blockcinema] video: H.264 ' + video.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')
      + ', MSE H.264 ' + (window.MediaSource && MediaSource.isTypeSupported('video/mp4; codecs="avc1.42E01E,mp4a.40.2"')));

  var url = null;
  try {
    url = new URL(src);
  } catch (e) {
  }
  if (!url || (url.protocol !== 'https:' && url.protocol !== 'http:')) {
    show('No video');
  } else if (/\.m3u8$/i.test(url.pathname) && window.Hls && Hls.isSupported()) {
    var hls = new Hls({
      startPosition: start > 0 ? start : -1,
      xhrSetup: function (xhr, requestUrl) {
        if (auth && new URL(requestUrl).origin === url.origin) {
          xhr.setRequestHeader('Authorization', auth);
        }
      }
    });
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data.fatal) {
        show('Can\'t play this video (' + data.details + ')');
      }
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    video.src = src;
    video.addEventListener('loadedmetadata', function () {
      if (start > 0 && (!isFinite(video.duration) || start < video.duration - 5)) {
        video.currentTime = start;
      }
    }, { once: true });
  }
  setInterval(function () {
    report(video.currentTime, video.duration, video.paused);
  }, 1000);
  video.addEventListener('error', function () {
    show('Can\'t play this video' + (video.error ? ' (error ' + video.error.code + ')' : ''));
  });
  video.addEventListener('ended', function () {
    show('The end');
  });
  video.play().catch(function () {});
</script>
</body>
</html>
