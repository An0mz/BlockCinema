<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body, #player, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
  // Plays one channel with Twitch's official embedded player (Twitch.Player), filling the page.
  // Twitch requires the embedding page's domain as "parent".
  var channel = new URLSearchParams(location.search).get('channel') || '';
  if (/^[a-z0-9_]{1,25}$/.test(channel)) {
    var player = new Twitch.Player('player', {
      channel: channel,
      parent: [location.hostname],
      width: '100%',
      height: '100%',
      autoplay: true,
      muted: false
    });
    // Player events and playback state go to the browser log (run/debug.log), to find why live playback stalls.
    ['READY', 'PLAY', 'PLAYING', 'PAUSE', 'ENDED', 'ONLINE', 'OFFLINE', 'PLAYBACK_BLOCKED'].forEach(function (name) {
      player.addEventListener(Twitch.Player[name], function () {
        console.log('[blockcinema] twitch event ' + name);
      });
    });
    setInterval(function () {
      try {
        console.log('[blockcinema] twitch t=' + player.getCurrentTime().toFixed(1) + ' paused=' + player.isPaused()
            + ' stats=' + JSON.stringify(player.getPlaybackStats()));
      } catch (e) {
        console.log('[blockcinema] twitch state unavailable: ' + e);
      }
    }, 5000);
  }
</script>
</body>
</html>
