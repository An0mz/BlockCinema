<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body, #player, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
  // Plays one channel or past video with Twitch's official embedded player (Twitch.Player), or one clip
  // with Twitch's clip embed, filling the page. Twitch requires the embedding page's domain as "parent".
  var params = new URLSearchParams(location.search);
  var channel = /^[a-z0-9_]{1,25}$/.test(params.get('channel') || '') ? params.get('channel') : null;
  var video = /^\d{1,12}$/.test(params.get('video') || '') ? params.get('video') : null;
  var clip = /^[A-Za-z0-9_-]{1,100}$/.test(params.get('clip') || '') ? params.get('clip') : null;
  var start = Math.floor(Number(new URLSearchParams(location.hash.slice(1)).get('start')) || 0);
  var player;
  var ready = false;
  var volume = 0;

  // Twitch's clip embed gives a page nothing to control it with, so a clip is heard as Twitch plays it or
  // not at all, and starts again when that changes (a little apart, so it doesn't flip back and forth).
  var clipFrame = null;
  var clipHeard = null;
  function showClip() {
    var heard = volume >= (clipHeard ? 0.2 : 0.3);
    if (heard === clipHeard) {
      return;
    }
    clipHeard = heard;
    if (!clipFrame) {
      clipFrame = document.createElement('iframe');
      clipFrame.allow = 'autoplay';
      document.getElementById('player').appendChild(clipFrame);
    }
    clipFrame.src = 'https://clips.twitch.tv/embed?clip=' + clip + '&parent=' + location.hostname + '&autoplay=true&muted=' + !heard;
  }

  // Called by the mod a few times a second: volume 0 to 1 from the player's distance, set with the
  // player's own volume control. Twitch keeps playing out of sight, so "visible" isn't used here.
  window.blockcinemaState = function (newVolume, visible) {
    volume = newVolume;
    if (clip) {
      showClip();
    } else if (ready) {
      player.setVolume(volume);
    }
  };

  function report(time, length, paused) {
    console.log('[blockcinema-state] ' + (time || 0).toFixed(1) + ' ' + (isFinite(length) && length > 0 ? length.toFixed(1) : '0')
        + ' ' + (paused ? 1 : 0) + ' 0');
  }

  function reportError(code) {
    console.log('[blockcinema-error] ' + code);
  }

  function reportEnded() {
    console.log('[blockcinema-ended]');
  }

  // Only past videos can be seeked.
  window.blockcinemaSeek = function (seconds) {
    if (ready && video) {
      player.seek(Math.max(0, seconds));
    }
  };

  window.blockcinemaSetPaused = function (paused) {
    if (!ready) {
      return;
    }
    if (paused) {
      player.pause();
    } else {
      player.play();
    }
  };

  if (channel || video) {
    var options = { parent: [location.hostname], width: '100%', height: '100%', autoplay: true, muted: false };
    if (video) {
      options.video = video;
      options.time = Math.floor(start / 3600) + 'h' + Math.floor(start % 3600 / 60) + 'm' + start % 60 + 's';
    } else {
      options.channel = channel;
    }
    player = new Twitch.Player('player', options);
    player.addEventListener(Twitch.Player.OFFLINE, function () {
      reportError('offline');
      // A stream that went offline is over: the queue goes on.
      reportEnded();
    });
    if (video) {
      player.addEventListener(Twitch.Player.ENDED, reportEnded);
    }
    player.addEventListener(Twitch.Player.PLAYING, function () {
      reportError('none');
    });
    player.addEventListener(Twitch.Player.READY, function () {
      ready = true;
      setInterval(function () {
        report(player.getCurrentTime(), video ? player.getDuration() : 0, player.isPaused());
      }, 1000);
      player.setVolume(volume);
    });
  }
</script>
</body>
</html>
