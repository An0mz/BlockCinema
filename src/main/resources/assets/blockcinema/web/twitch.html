<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body, #player, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #000; overflow: hidden; }
</style>
</head>
<body>
<div id="player"></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
  // Plays one channel with Twitch's official embedded player (Twitch.Player), filling the page.
  // Twitch requires the embedding page's domain as "parent".
  var channel = new URLSearchParams(location.search).get('channel') || '';
  var player;
  var ready = false;
  var volume = 1;

  // Called by the mod a few times a second: volume 0 to 1 from the player's distance, set with the
  // player's own volume control. Live streams keep playing out of sight, so "visible" isn't used here.
  window.blockcinemaState = function (newVolume, visible) {
    volume = newVolume;
    if (ready) {
      player.setVolume(volume);
    }
  };

  // Where the video is, once a second, for the mod's time bar and resume (read from the browser console):
  // "[blockcinema-state] <seconds> <length in seconds, 0 if live or unknown> <1 if paused>".
  function report(time, length, paused) {
    console.log('[blockcinema-state] ' + (time || 0).toFixed(1) + ' ' + (isFinite(length) && length > 0 ? length.toFixed(1) : '0')
        + ' ' + (paused ? 1 : 0));
  }

  // What went wrong, for the mod's messages ("none" when playing again):
  // "[blockcinema-error] <code>".
  function reportError(code) {
    console.log('[blockcinema-error] ' + code);
  }

  // The video ended, so the screen's queue can go on: "[blockcinema-ended]".
  function reportEnded() {
    console.log('[blockcinema-ended]');
  }

  // Live streams can't be seeked.
  window.blockcinemaSeek = function (seconds) {
  };

  // Called by the mod to follow the TV's shared play/pause state.
  window.blockcinemaSetPaused = function (paused) {
    if (!ready) {
      return;
    }
    if (paused) {
      player.pause();
    } else {
      player.play();
    }
  };

  if (/^[a-z0-9_]{1,25}$/.test(channel)) {
    player = new Twitch.Player('player', {
      channel: channel,
      parent: [location.hostname],
      width: '100%',
      height: '100%',
      autoplay: true,
      muted: false
    });
    player.addEventListener(Twitch.Player.OFFLINE, function () {
      reportError('offline');
      // A stream that went offline is over: the queue goes on.
      reportEnded();
    });
    player.addEventListener(Twitch.Player.PLAYING, function () {
      reportError('none');
    });
    player.addEventListener(Twitch.Player.READY, function () {
      ready = true;
      setInterval(function () {
        report(player.getCurrentTime(), 0, player.isPaused());
      }, 1000);
      player.setVolume(volume);
    });
  }
</script>
</body>
</html>
