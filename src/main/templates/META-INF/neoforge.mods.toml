modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/An0mz/BlockCinema/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# update.json in the repository: list each release there to tell players about it.
updateJSONURL="https://raw.githubusercontent.com/An0mz/BlockCinema/main/update.json"
displayURL="https://github.com/An0mz/BlockCinema"
logoFile="blockcinema_logo.png"
credits="Videos play in Chromium through MCEF (https://github.com/CinemaMod/mcef, LGPL-2.1). HLS playback by hls.js (https://github.com/video-dev/hls.js, Apache-2.0). YouTube, Twitch and Jellyfin are trademarks of their owners; Block Cinema isn't affiliated with them."
authors="Anomz"
description='''
Watch YouTube, Twitch, your own Jellyfin server and direct video links on TV blocks, alone or together.
Put TVs side by side for screens up to 16x9 blocks. Only these services can be shown: there is no web browsing.
Needs MCEF on the client, which downloads Chromium on first start.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Chromium, which shows the TV's picture. Only needed on the client.
[[dependencies.${mod_id}]]
    modId="mcef"
    type="required"
    versionRange="[${mcef_version},)"
    ordering="AFTER"
    side="CLIENT"
